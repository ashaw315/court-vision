name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, ETL tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: etl/requirements.txt
      - run: pip install -r etl/requirements.txt ruff
      - run: ruff check .
      - run: python -m pytest -q etl/tests

  database:
    name: Database and API tests
    runs-on: ubuntu-latest
    # Fork PRs do not receive secrets; the suite would only fail on the missing URL.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      # A dedicated Neon branch holding the migrated schema plus the committed Nets 2025-26
      # sample (`npm run db:seed`). Never the production branch.
      DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      API_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fail early if the secret is missing
        run: test -n "$DATABASE_URL" || (echo "TEST_DATABASE_URL secret is not set" && exit 1)
      - name: Apply migrations and reload the sample
        run: |
          npx drizzle-kit migrate
          npm run db:seed
          npm run db:verify
      - name: Build and start the app
        run: |
          npm run build
          nohup npm start > server.log 2>&1 &
          npx --yes wait-on http://localhost:3000/api/players --timeout 60000
      - run: npm test
      - name: Server log on failure
        if: failure()
        run: tail -n 100 server.log || true
